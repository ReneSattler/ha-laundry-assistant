set_price:
  name: Set price
  description: Sets the electricity price used to cost a cycle.
  fields:
    entry_id:
      required: true
      selector:
        text:
    price_per_kwh:
      required: true
      example: 0.30
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
    currency:
      required: false
      example: EUR
      selector:
        text:

set_reminder:
  name: Set reminder
  description: Configures the reminder for laundry left in the drum.
  fields:
    entry_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    delay_minutes:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    repeat_minutes:
      required: false
      example: 30
      selector:
        number:
          min: 1
          max: 1440
          mode: box
    max_repeats:
      required: false
      example: 3
      selector:
        number:
          min: 1
          max: 10
          mode: box

set_notify_target:
  name: Set notification target
  description: >-
    Sets which notify service receives the reminder, e.g.
    mobile_app_my_phone. Omit the target to disable notifications.
  fields:
    entry_id:
      required: true
      selector:
        text:
    target:
      required: false
      example: mobile_app_my_phone
      selector:
        text:

set_thresholds:
  name: Set band thresholds
  description: >-
    Sets the power band edges in watts. Must increase strictly from standby
    to high.
  fields:
    entry_id:
      required: true
      selector:
        text:
    thresholds:
      required: true
      example: '{"standby": 2, "low": 20, "medium": 150, "high": 800}'
      selector:
        object:

start_calibration:
  name: Start calibration
  description: >-
    Records the next few complete runs and proposes band thresholds from
    them. Detection keeps using the current thresholds meanwhile.
  fields:
    entry_id:
      required: true
      selector:
        text:

cancel_calibration:
  name: Cancel calibration
  description: Stops recording and discards the collected samples.
  fields:
    entry_id:
      required: true
      selector:
        text:

apply_calibration:
  name: Apply calibration
  description: Adopts the proposed thresholds. Fails if no proposal is ready.
  fields:
    entry_id:
      required: true
      selector:
        text:

dismiss_reminder:
  name: Dismiss reminder
  description: Cancels a pending reminder for laundry left in the drum.
  fields:
    entry_id:
      required: true
      selector:
        text:

clear_history:
  name: Clear history
  description: >-
    Deletes all stored runs. The remaining-time estimate has to relearn
    afterwards, and the weekly totals restart at zero.
  fields:
    entry_id:
      required: true
      selector:
        text:

set_anomaly_detection:
  name: Set deviation warnings
  description: >-
    Enables comparing each finished run against the appliance's history, and
    sets how far a phase may stray before it is reported.
  fields:
    entry_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    factor:
      required: false
      example: 1.6
      selector:
        number:
          min: 1.1
          max: 5
          step: 0.1
          mode: box

dismiss_anomalies:
  name: Dismiss deviation warnings
  description: Clears the findings from the last run.
  fields:
    entry_id:
      required: true
      selector:
        text:

set_program_name:
  name: Name a program
  description: >-
    Gives a recognised program a name, e.g. "Cotton 60". The program ids are
    listed in the phase sensor's "programs" attribute.
  fields:
    entry_id:
      required: true
      selector:
        text:
    program_id:
      required: true
      selector:
        text:
    name:
      required: true
      example: Cotton 60
      selector:
        text:

set_solar:
  name: Set solar surplus sources
  description: >-
    Points the appliance at a solar production sensor and, optionally, a
    house consumption sensor, so it can tell when a cycle would run on
    surplus. Omit the solar entity to switch the suggestion off.
  fields:
    entry_id:
      required: true
      selector:
        text:
    solar_entity:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    consumption_entity:
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    feed_in_tariff:
      required: false
      example: 0.08
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
